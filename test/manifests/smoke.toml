[profile]
id = "smoke"
max_duration_minutes = 20
tier = ["smoke", "release-candidate", "full"]
suites = ["security"]

[[profile.cases]]
id = "rust-fmt-check"
suite = "static"
risk = "P1"
runner = "static"
command = "cargo fmt --all -- --check"
timeout_seconds = 120

[[profile.cases]]
id = "rust-workspace-test"
suite = "rust"
risk = "P0"
runner = "cargo"
command = "cargo test --workspace"
timeout_seconds = 1800

[profile.cases.meta]
build_dashboard_ui = true

[[profile.cases]]
id = "rust-tools-browser"
suite = "browser"
risk = "P1"
runner = "cargo"
command = "cargo test -p anycode-browser && cargo test -p anycode-tools --features tools-browser"
timeout_seconds = 600

[[profile.cases]]
id = "rust-runtime-crates"
suite = "rust"
risk = "P0"
runner = "cargo"
command = "cargo test -p anycode-config -p anycode-bootstrap -p anycode-channel-bridge -p anycode-dashboard-ipc"
timeout_seconds = 900

[[profile.cases]]
id = "dashboard-ui-vitest"
suite = "dashboard"
risk = "P0"
runner = "npm"
command = "npm test"
timeout_seconds = 300

[profile.cases.meta]
workdir = "crates/dashboard-ui"

[[profile.cases]]
id = "playwright-acceptance-health"
suite = "dashboard"
risk = "P0"
runner = "playwright"
timeout_seconds = 300

[profile.cases.meta]
spec = "e2e/acceptance.spec.ts"

[[profile.cases]]
id = "playwright-v3-api"
suite = "dashboard"
risk = "P0"
runner = "playwright"
timeout_seconds = 300

[profile.cases.meta]
spec = "e2e/v3-api.spec.ts"

[[profile.cases]]
id = "playwright-conversation-streaming"
suite = "dashboard"
risk = "P0"
runner = "playwright"
timeout_seconds = 300

[profile.cases.meta]
spec = "e2e/conversation-streaming.spec.ts"

[[profile.cases]]
id = "playwright-v3-week3-cancel"
suite = "dashboard"
risk = "P0"
runner = "playwright"
timeout_seconds = 300

[profile.cases.meta]
spec = "e2e/v3-week3-api.spec.ts"

[[profile.cases]]
id = "account-service-test"
suite = "account"
risk = "P0"
runner = "cargo"
command = "cargo test --all-targets"
timeout_seconds = 600

[profile.cases.meta]
workdir = "crates/account-service"

[[profile.cases]]
id = "risk-catalog-gate"
suite = "risk"
risk = "P0"
runner = "static"
command = "python3 test/runner/risk_gate.py"
timeout_seconds = 60
