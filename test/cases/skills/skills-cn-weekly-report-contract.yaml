id: skills-cn-weekly-report-contract
tier:
- full
risk: P1
runner: dashboard
prompts:
- 'Validate the official skill ''cn-weekly-report'': read SKILL.md frontmatter, run
  vet checks, and confirm required env contract.'
expected:
  assertions:
  - validator: skill_frontmatter_valid
    args:
      skill_id: cn-weekly-report
      source: official
  - validator: skill_vet_pass
    args:
      skill_id: cn-weekly-report
requires:
  llm: live
  network: false
  tools:
  - skills
timeout_seconds: 300
meta:
  skill_id: cn-weekly-report
  skills:
  - cn-weekly-report
