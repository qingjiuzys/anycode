[package]
name = "anycode-bootstrap"
version.workspace = true
edition.workspace = true
description = "Shared AgentRuntime composition root for anyCode app, dashboard, and daemon"
license = "MIT"

[features]
default = []
tools-mcp = ["anycode-tools/tools-mcp"]
tools-lsp = ["anycode-tools/tools-lsp"]
tools-browser = ["anycode-tools/tools-browser", "dep:anycode-browser"]
embedding-local = ["anycode-memory/embedding-local", "anycode-llm/embedding-local"]
knowledge-embeddings = ["anycode-tools/knowledge-embeddings"]
dialoguer-host = ["dep:dialoguer", "dep:console"]

[lib]
name = "anycode_bootstrap"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
anycode-agent = { path = "../agent" }
anycode-browser = { path = "../browser", optional = true }
anycode-config = { path = "../config" }
anycode-core = { path = "../core" }
anycode-dashboard-ipc = { path = "../dashboard-ipc" }
anycode-locale = { path = "../locale" }
anycode-llm = { path = "../llm" }
anycode-memory = { path = "../memory" }
anycode-security = { path = "../security" }
anycode-tools = { path = "../tools" }
async-trait = { workspace = true }
console = { version = "0.16", optional = true }
dialoguer = { version = "0.12", optional = true }
dirs = "5"
regex = "1.10"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
