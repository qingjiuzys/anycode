[package]
name = "anycode-channel-bridge"
version.workspace = true
edition.workspace = true
description = "Headless anyCode daemon (channels/cron)"
license = "MIT"

[lib]
name = "anycode_channel_bridge"
path = "src/lib.rs"

[[bin]]
name = "anycode-daemon"
path = "src/bin/anycode_daemon.rs"

[features]
default = []
tools-mcp = ["anycode-bootstrap/tools-mcp"]
tools-browser = ["anycode-bootstrap/tools-browser"]
embedding-local = ["anycode-bootstrap/embedding-local"]
knowledge-embeddings = ["anycode-bootstrap/knowledge-embeddings"]

[dependencies]
anyhow = { workspace = true }
anycode-agent = { path = "../agent" }
anycode-apple-media = { path = "../apple-media" }
anycode-bootstrap = { path = "../bootstrap", features = ["tools-mcp", "tools-browser", "embedding-local", "knowledge-embeddings"] }
anycode-config = { path = "../config" }
anycode-core = { path = "../core" }
anycode-dashboard = { path = "../dashboard" }
anycode-locale = { path = "../locale" }
anycode-llm = { path = "../llm" }
anycode-memory = { path = "../memory" }
anycode-security = { path = "../security" }
anycode-tools = { path = "../tools" }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
cron = { workspace = true }
dirs = "5"
fluent-bundle = "0.15.2"
fs4 = "0.12"
once_cell = "1.19"
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unic-langid = "0.9.4"
uuid = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
