[package]
name = "anycode-channel-bridge"
version.workspace = true
edition.workspace = true
description = "Headless anyCode daemon (channels/cron)"
license = "MIT"

[lib]
name = "anycode_channel_bridge"
path = "src/lib.rs"

[[bin]]
name = "anycode-daemon"
path = "src/bin/anycode_daemon.rs"

[features]
default = []
tools-mcp = ["anycode-bootstrap/tools-mcp"]
tools-browser = ["anycode-bootstrap/tools-browser"]
embedding-local = ["anycode-bootstrap/embedding-local"]
knowledge-embeddings = ["anycode-bootstrap/knowledge-embeddings"]

[dependencies]
anyhow = { workspace = true }
anycode-agent = { path = "../agent" }
anycode-apple-media = { path = "../apple-media" }
anycode-bootstrap = { path = "../bootstrap", features = ["tools-mcp", "tools-browser", "embedding-local", "knowledge-embeddings"] }
anycode-channels = { path = "../channels" }
anycode-config = { path = "../config" }
anycode-core = { path = "../core" }
anycode-dashboard = { path = "../dashboard" }
anycode-locale = { path = "../locale" }
anycode-llm = { path = "../llm" }
anycode-memory = { path = "../memory" }
anycode-security = { path = "../security" }
anycode-tools = { path = "../tools" }
anycode-wechat-history = { path = "../wechat-history" }
async-trait = { workspace = true }
base64 = "0.22"
chrono = { workspace = true }
clap = { version = "4.4", features = ["derive", "env"] }
cron = { workspace = true }
dirs = "5"
fluent-bundle = "0.15.2"
fs4 = "0.12"
fuzzy-matcher = "0.3"
hex = "0.4"
lru = "0.12"
md5 = "0.7"
notify = { workspace = true }
once_cell = "1.19"
qrcode = "0.14"
rand = "0.8"
regex = "1.10"
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unic-langid = "0.9.4"
url = "2.5"
urlencoding = "2.1"
uuid = { workspace = true }
aes = "0.8"
dialoguer = "0.12"
cipher = { version = "0.4", features = ["block-padding"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true
