<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>方法 · 五步链路</title>
  <style>
    :root{--bg:#f2f5f0;--ink:#231f20;--accent:#1400ff;--ink-60:rgba(35,31,32,.72);--ink-40:rgba(35,31,32,.55);
      --serif:"Songti SC","Noto Serif SC",serif;--sans:"PingFang SC",sans-serif;--mono:"JetBrains Mono",monospace}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
    .slide{padding:72px 96px;height:100%;box-sizing:border-box}
    .sec-label{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);
      display:flex;align-items:center;gap:14px;margin-bottom:20px}
    .sec-label::after{content:"";flex:1;height:6px;background:var(--ink);max-width:480px}
    .sec-label .num{color:var(--accent);font-weight:700}
    h3{font-family:var(--serif);font-weight:900;font-size:48px;margin:0 0 16px;max-width:1200px}
    .lede{font-size:18px;color:var(--ink-60);max-width:900px;margin-bottom:36px;line-height:1.65}
    .ladder{display:flex;border:1px solid var(--ink);width:100%;max-width:1600px;margin-bottom:32px}
    .rung{flex:1;font-family:var(--mono);padding:20px 16px;border-right:1px solid var(--ink);text-align:center}
    .rung:last-child{border-right:none}
    .rung small{display:block;font-size:11px;letter-spacing:.1em;color:var(--ink-40);text-transform:uppercase;margin-bottom:8px}
    .rung b{display:block;font-size:20px;font-weight:700;margin-bottom:6px}
    .rung span{font-size:14px;color:var(--ink-60);line-height:1.4;display:block}
    .rung.on{background:var(--ink);color:var(--bg)}
    .rung.on small{color:rgba(242,245,240,.55)}
    .rung.on span{color:rgba(242,245,240,.75)}
    .rung.hot{background:var(--accent);color:#fff;border-right-color:var(--accent)}
    .rung.hot small{color:rgba(255,255,255,.65)}
    .rung.hot span{color:rgba(255,255,255,.85)}
    .tag-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .tag{font-family:var(--mono);font-size:13px;padding:6px 12px;border:1px solid var(--ink-40);color:var(--ink-60)}
    .tag.solid{background:var(--accent);color:#fff;border-color:var(--accent)}
  </style>
</head>
<body>

  <div class="slide" data-type="content">
    <div class="sec-label"><span class="num">03</span>方法 · RESEARCH LOOP</div>
    <h3>能拍板的调研只做五步</h3>
    <p class="lede">每一步都要留下可复查的证据：录音纪要、门店计数表、租金截图、问卷原始表。</p>
    <div class="ladder">
      <div class="rung"><small>STEP 1</small><b>定问题</b><span>开店 / 不做 / 换品类</span></div>
      <div class="rung"><small>STEP 2</small><b>定样本</b><span>3 圈层 × 40 人</span></div>
      <div class="rung on"><small>STEP 3</small><b>采证据</b><span>拦截 + 竞品点位</span></div>
      <div class="rung"><small>STEP 4</small><b>交叉验</b><span>问卷 vs 客流 vs 租金</span></div>
      <div class="rung hot"><small>STEP 5</small><b>出决策</b><span>阈值 + 条件</span></div>
    </div>
    <div class="tag-row">
      <span class="tag solid">决策问题优先</span>
      <span class="tag">不堆 50 题问卷</span>
      <span class="tag">证据可复查</span>
      <span class="tag">两周交付</span>
    </div>
  </div>

</body>
</html>
