<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>金句 · 结论</title>
  <style>
    :root{--bg:#f2f5f0;--ink:#231f20;--accent:#1400ff;--ink-60:rgba(35,31,32,.72);
      --serif:"Songti SC","Noto Serif SC",serif;--sans:"PingFang SC",sans-serif;--mono:"JetBrains Mono",monospace}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
    .slide{padding:72px 96px;height:100%;box-sizing:border-box;display:grid;grid-template-rows:auto 1fr auto}
    .sec-label{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);
      display:flex;align-items:center;gap:14px;margin-bottom:20px}
    .sec-label::after{content:"";flex:1;height:6px;background:var(--ink);max-width:480px}
    .sec-label .num{color:var(--accent);font-weight:700}
    .quote{max-width:1400px;align-self:center;border:1px solid var(--ink);padding:56px 64px;background:var(--ink);color:var(--bg)}
    .quote p{font-family:var(--serif);font-size:42px;font-weight:900;line-height:1.45;margin:0 0 28px}
    .quote p em{font-style:normal;color:rgba(242,245,240,.55)}
    .quote .source{font-family:var(--mono);font-size:14px;letter-spacing:.1em;color:rgba(242,245,240,.65)}
    .quote .source b{color:var(--accent);font-weight:700}
    .footnote{font-size:16px;color:var(--ink-60);line-height:1.65;max-width:900px}
  </style>
</head>
<body>

  <div class="slide" data-type="content">
    <div class="sec-label"><span class="num">06</span>金句 · INSIGHT</div>
    <div class="quote">
      <p>调研的价值不在「收集了多少意见」，<em>而在</em>能不能<strong style="color:var(--accent);border-bottom:4px solid var(--accent)">在截止日前给出可执行的开店条件</strong>。</p>
      <div class="source"><b>本节结论</b> · 县城咖啡市场调研方法课 · anyCode Demo</div>
    </div>
    <p class="footnote">带走这句话：没有决策问题的问卷，只是把焦虑外包给表格。</p>
  </div>

</body>
</html>
