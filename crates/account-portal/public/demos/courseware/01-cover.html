<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>封面 · 县城咖啡市场调研</title>
  <style>
    :root{--bg:#f2f5f0;--ink:#231f20;--accent:#1400ff;--ink-60:rgba(35,31,32,.72);--ink-40:rgba(35,31,32,.55);
      --serif:"Songti SC","Noto Serif SC",serif;--sans:"PingFang SC",sans-serif;--mono:"JetBrains Mono",monospace}
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
    .slide{padding:72px 96px;height:100%;box-sizing:border-box;border-bottom:8px solid var(--ink)}
    .sec-label{font-family:var(--mono);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);
      display:flex;align-items:center;gap:14px;margin-bottom:28px}
    .sec-label::after{content:"";flex:1;height:6px;background:var(--ink);max-width:480px}
    .sec-label .num{color:var(--accent);font-weight:700}
    h1{font-family:var(--serif);font-weight:900;font-size:84px;line-height:1.12;margin:0 0 24px;max-width:1500px}
    h1 .thin{font-weight:400;color:var(--ink-60)}
    .statement{font-family:var(--serif);font-size:32px;line-height:1.55;max-width:1100px;margin-bottom:48px}
    .statement strong{color:var(--accent);font-weight:900;border-bottom:6px solid var(--accent)}
    .ladder{display:flex;border:1px solid var(--ink);width:max-content;margin-top:24px}
    .rung{font-family:var(--mono);padding:16px 20px;border-right:1px solid var(--ink);min-width:120px}
    .rung:last-child{border-right:none}
    .rung small{display:block;font-size:11px;letter-spacing:.1em;color:var(--ink-40);text-transform:uppercase;margin-bottom:6px}
    .rung b{font-size:18px;font-weight:700}
    .rung.hot{background:var(--accent);color:#fff;border-right-color:var(--accent)}
    .rung.hot small{color:rgba(255,255,255,.65)}
    .brand-bar{position:absolute;left:96px;bottom:36px;font-family:var(--mono);font-size:13px;letter-spacing:.14em;color:var(--ink-40)}
  </style>
</head>
<body>

  <div class="slide" data-type="cover">
    <div class="sec-label"><span class="num">01</span>COURSEWARE · MARKET RESEARCH</div>
    <h1>县城咖啡市场：<br><span class="thin">怎么做一次能拍板的调研</span></h1>
    <p class="statement">内训课件。目标不是「写满问卷」，而是<strong>两周内给出开不开店的决策依据</strong>。</p>
    <div class="ladder">
      <div class="rung"><small>01</small><b>问题</b></div>
      <div class="rung"><small>02</small><b>方法</b></div>
      <div class="rung"><small>03</small><b>数据</b></div>
      <div class="rung"><small>04</small><b>对比</b></div>
      <div class="rung hot"><small>05</small><b>行动</b></div>
    </div>
    <div class="brand-bar">anyCode Demo · 培训课件 · 脱敏案例 · 2026</div>
  </div>

</body>
</html>
