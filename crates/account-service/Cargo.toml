[package]
name = "anycode-account-service"
version = "0.2.4"
edition = "2021"
description = "Central cloud account, subscription, and billing API for anyCode"
license = "MIT"

[workspace]

[[bin]]
name = "anycode-account"
path = "src/main.rs"

[lib]
name = "anycode_account_service"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
argon2 = { version = "0.5", features = ["std"] }
rsa = { version = "0.9", features = ["sha2", "pem"] }
base64 = "0.22"
rand = "0.8"
aes-gcm = "0.10"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "mysql", "chrono", "uuid"] }
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.10"
