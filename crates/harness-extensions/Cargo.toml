[package]
name = "anycode-harness-extensions"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anycode-harness-core = { path = "../harness-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.35", features = ["process", "io-util", "sync", "time", "macros"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
futures = "0.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
