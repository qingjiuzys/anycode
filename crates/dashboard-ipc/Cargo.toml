[package]
name = "anycode-dashboard-ipc"
version.workspace = true
edition.workspace = true
description = "File-based IPC between anyCode runtime and dashboard Web UI"
license = "MIT"

[lib]
name = "anycode_dashboard_ipc"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
dirs = "5"

[dev-dependencies]
tempfile = "3"
