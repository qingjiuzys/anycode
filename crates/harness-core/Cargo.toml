[package]
name = "anycode-harness-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Transport-neutral, Pi-inspired execution kernel for anyCode"

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.35", features = ["rt", "macros", "sync", "time"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3.10"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
