[package]
name = "anycode-agent"
version.workspace = true
edition.workspace = true

[features]
default = []
harness-v1 = [
    "dep:anycode-harness-core",
    "dep:anycode-harness-host",
    "dep:anycode-harness-extensions",
]

[dependencies]
anycode-harness-core = { path = "../harness-core", optional = true }
anycode-harness-host = { path = "../harness-host", optional = true }
anycode-harness-extensions = { path = "../harness-extensions", optional = true }
anycode-core = { path = "../core" }
anycode-llm = { path = "../llm" }
anycode-memory = { path = "../memory" }
anycode-security = { path = "../security" }
anycode-tools = { path = "../tools" }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
dirs = "5"
regex = "1.10"
reqwest = { workspace = true }
futures = "0.3"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
