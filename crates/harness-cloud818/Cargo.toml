[package]
name = "anycode-harness-cloud818"
version = "0.1.0"
edition = "2021"
license = "MIT"
[dependencies]
anycode-harness-core = { path = "../harness-core" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1.6", features = ["v4", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
[dev-dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true
