<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>818Cloud 控制平面</title>
  <style>
    :root {
      --bg: #1a1b26;
      --ink: #c0caf5;
      --accent: #7aa2f7;
      --ink-60: rgba(192, 202, 245, 0.72);
      --ink-40: rgba(192, 202, 245, 0.55);
      --ink-08: rgba(192, 202, 245, 0.08);
      --serif: "Noto Serif SC", "Songti SC", serif;
      --sans: "Noto Sans SC", "PingFang SC", sans-serif;
      --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: var(--bg); color: var(--ink); font-family: var(--sans);
    }
    .slide { height: 100%; padding: 56px 88px; }
    .kicker {
      font-family: var(--mono); font-size: 14px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 14px;
    }
    h2 { font-size: 48px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 12px; }
    .lede { font-size: 20px; color: var(--ink-60); max-width: 1280px; margin-bottom: 28px; line-height: 1.5; }
    .stage { display: grid; grid-template-columns: 1fr 520px; gap: 32px; }
    .plane {
      border: 1px solid rgba(122,162,247,0.25);
      background: rgba(192,202,245,0.03);
      padding: 20px;
      height: 700px;
    }
    .side { display: grid; gap: 16px; }
    .box {
      border: 1px solid rgba(122,162,247,0.22);
      padding: 22px 24px;
      background: rgba(122,162,247,0.06);
    }
    .box h3 { font-size: 22px; margin-bottom: 8px; }
    .box p { font-size: 17px; color: var(--ink-60); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="slide" data-type="content">
    <div class="kicker">07 · 818CLOUD · CONTROL PLANE</div>
    <h2>和现有容器平台同构交付</h2>
    <p class="lede">818Cloud 是控制平面，不是又一个聊天站。账户、网关、镜像、对象存储在企业集群里按生产习惯落地。</p>
    <div class="stage">
      <svg class="plane" viewBox="0 0 1040 700" role="img" aria-label="K8s 控制平面">
        <rect x="40" y="40" width="960" height="620" rx="8" fill="none" stroke="#7aa2f7" stroke-opacity="0.35"/>
        <text x="64" y="84" fill="#7aa2f7" font-size="16" font-family="ui-monospace,monospace">CLUSTER / INTRANET</text>
        <rect x="80" y="120" width="280" height="160" fill="rgba(122,162,247,0.1)" stroke="#7aa2f7"/>
        <text x="100" y="168" fill="#c0caf5" font-size="22">Ingress</text>
        <text x="100" y="200" fill="#7aa2f7" font-size="14" font-family="ui-monospace,monospace">工作台 · 控制台 · API</text>
        <rect x="400" y="120" width="280" height="160" fill="rgba(122,162,247,0.1)" stroke="#7aa2f7"/>
        <text x="420" y="168" fill="#c0caf5" font-size="22">Deployment</text>
        <text x="420" y="200" fill="#7aa2f7" font-size="14" font-family="ui-monospace,monospace">account · gateway · worker</text>
        <rect x="720" y="120" width="240" height="160" fill="rgba(122,162,247,0.1)" stroke="#7aa2f7"/>
        <text x="740" y="168" fill="#c0caf5" font-size="22">Secret</text>
        <text x="740" y="200" fill="#7aa2f7" font-size="14" font-family="ui-monospace,monospace">证书运行时挂载</text>
        <rect x="80" y="330" width="400" height="150" fill="none" stroke="#7aa2f7"/>
        <text x="100" y="378" fill="#c0caf5" font-size="22">模型网关</text>
        <text x="100" y="414" fill="#c0caf5" font-size="16">BYOK · 企业端点 · 用量计量</text>
        <rect x="520" y="330" width="440" height="150" fill="none" stroke="#7aa2f7"/>
        <text x="540" y="378" fill="#c0caf5" font-size="22">S3 兼容存储</text>
        <text x="540" y="414" fill="#c0caf5" font-size="16">知识附件 · 邮件附件 · 交付物</text>
        <rect x="80" y="520" width="880" height="100" fill="rgba(122,162,247,0.08)" stroke="#7aa2f7"/>
        <text x="100" y="578" fill="#c0caf5" font-size="20">私有镜像仓库  →  滚动发布  →  健康检查  →  可回滚</text>
      </svg>
      <div class="side">
        <article class="box">
          <h3>生产级交付</h3>
          <p>镜像进企业仓库，用 Deployment / Ingress 管理，而不是U盘拷一份不可复现的安装包。</p>
        </article>
        <article class="box">
          <h3>证书不进镜像</h3>
          <p>支付与渠道证书运行时挂载。镜像可审计，密钥不随版本漂走。</p>
        </article>
        <article class="box">
          <h3>云是选项</h3>
          <p>公有云控制台用于账户与试用；企业主路径是同一套能力装进内网。</p>
        </article>
        <article class="box">
          <h3>对象存储可换</h3>
          <p>不绑单一云厂商桶。S3 API 对齐信息化已采购的存储。</p>
        </article>
      </div>
    </div>
  </div>
</body>
</html>
