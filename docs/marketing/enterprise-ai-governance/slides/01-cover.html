<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>走向 AI 原生治理</title>
  <style>
    :root {
      --bg: #1a1b26;
      --ink: #c0caf5;
      --accent: #7aa2f7;
      --ink-60: rgba(192, 202, 245, 0.72);
      --ink-40: rgba(192, 202, 245, 0.55);
      --ink-08: rgba(192, 202, 245, 0.08);
      --serif: "Noto Serif SC", "Songti SC", serif;
      --sans: "Noto Sans SC", "PingFang SC", sans-serif;
      --mono: "JetBrains Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px; height: 1080px; overflow: hidden; position: relative;
      background: var(--bg); color: var(--ink); font-family: var(--sans);
    }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .orbit { position: absolute; right: -40px; top: -80px; width: 980px; height: 980px; }
    .slide { position: relative; z-index: 2; height: 100%; padding: 72px 96px 64px; }
    .kicker {
      font-family: var(--mono); font-size: 15px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 36px;
    }
    h1 {
      font-family: var(--sans); font-weight: 800; font-size: 92px; line-height: 1.05;
      letter-spacing: -0.03em; max-width: 980px; margin-bottom: 28px;
    }
    h1 em { font-style: normal; color: var(--accent); }
    .lead {
      font-size: 28px; line-height: 1.5; color: var(--ink-60); max-width: 820px; margin-bottom: 48px;
    }
    .tags { display: flex; gap: 12px; flex-wrap: wrap; max-width: 900px; }
    .tag {
      font-family: var(--mono); font-size: 14px; letter-spacing: 0.08em;
      padding: 10px 16px; border: 1px solid rgba(122, 162, 247, 0.35);
      background: var(--ink-08); color: var(--ink);
    }
    .tag b { color: var(--accent); }
    .foot {
      position: absolute; left: 96px; bottom: 40px;
      font-family: var(--mono); font-size: 13px; letter-spacing: 0.12em; color: var(--ink-40);
    }
  </style>
</head>
<body>
  <canvas id="field" width="1920" height="1080"></canvas>
  <svg class="orbit" viewBox="0 0 980 980" aria-hidden="true">
    <defs>
      <radialGradient id="glow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.28"/>
        <stop offset="70%" stop-color="#7aa2f7" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="520" cy="480" r="320" fill="url(#glow)"/>
    <circle cx="520" cy="480" r="210" fill="none" stroke="#7aa2f7" stroke-opacity="0.18" stroke-width="1"/>
    <circle cx="520" cy="480" r="300" fill="none" stroke="#7aa2f7" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 10">
      <animateTransform attributeName="transform" type="rotate" from="0 520 480" to="360 520 480" dur="48s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="480" r="380" fill="none" stroke="#c0caf5" stroke-opacity="0.08" stroke-width="1"/>
    <g font-family="ui-monospace, monospace" font-size="18" fill="#c0caf5">
      <circle cx="730" cy="380" r="8" fill="#7aa2f7"/>
      <text x="748" y="386">anyCode</text>
      <circle cx="820" cy="560" r="8" fill="#7aa2f7"/>
      <text x="838" y="566">818Cloud</text>
      <circle cx="640" cy="720" r="8" fill="#7aa2f7"/>
      <text x="658" y="726">Mail</text>
      <circle cx="400" cy="640" r="8" fill="#7aa2f7"/>
      <text x="418" y="646">知识库</text>
    </g>
  </svg>
  <div class="slide" data-type="cover">
    <div class="kicker">818CLOUD · ENTERPRISE BRIEFING</div>
    <h1>走向 <em>AI 原生治理</em></h1>
    <p class="lead">给企业一套智能体的工作操作系统——能部署、能管辖、能审计。数据默认留在内网。</p>
    <div class="tags">
      <span class="tag"><b>01</b> 内网部署</span>
      <span class="tag"><b>02</b> Kubernetes</span>
      <span class="tag"><b>03</b> S3 企业存储</span>
      <span class="tag"><b>04</b> 企业知识库</span>
    </div>
    <div class="foot">杭州灵栖智能 · anyCode · 818Cloud · Mail · 知识库</div>
  </div>
  <script>
    const c = document.getElementById("field");
    const ctx = c.getContext("2d");
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * 1920,
      y: Math.random() * 1080,
      r: Math.random() * 1.4 + 0.3,
      a: Math.random() * 0.45 + 0.08,
    }));
    function draw() {
      ctx.clearRect(0, 0, 1920, 1080);
      const g = ctx.createRadialGradient(1500, 180, 40, 1500, 180, 520);
      g.addColorStop(0, "rgba(122,162,247,0.16)");
      g.addColorStop(1, "rgba(26,27,38,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 1920, 1080);
      for (const s of stars) {
        ctx.beginPath();
        ctx.fillStyle = "rgba(192,202,245," + s.a + ")";
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    draw();
  </script>
</body>
</html>
