name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    # Live Chromium CDP smoke needs a working browser+dbus; skip on GHA Linux.
    env:
      ANYCODE_SKIP_BROWSER_SMOKE: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace version sync
        run: ./scripts/sync-workspace-version.sh --check

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Build dashboard UI (embed + clippy/test)
        run: ANYCODE_BUILD_DASHBOARD_UI=1 ./scripts/build-dashboard-ui.sh

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo test (tools-lsp)
        run: cargo test -p anycode-tools --features tools-lsp

      - name: cargo test (tools-mcp)
        run: cargo test -p anycode-tools --features tools-mcp

      - name: cargo test (tools-browser)
        run: cargo test -p anycode-browser && cargo test -p anycode-tools --features tools-browser

      - name: cargo check (knowledge-embeddings)
        run: cargo check -p anycode-tools --features knowledge-embeddings

      - name: cargo test (new runtime crates)
        run: cargo test -p anycode-config -p anycode-bootstrap -p anycode-channel-bridge -p anycode-dashboard-ipc

      - name: Build release binaries
        run: |
          ANYCODE_BUILD_DASHBOARD_UI=1 cargo build --release -p anycode-channel-bridge
          ANYCODE_BUILD_DASHBOARD_UI=1 cargo build --release -p anycode-dashboard --features embedded-ui

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgomp1

      - name: Build anycode-desktop
        run: ANYCODE_BUILD_DASHBOARD_UI=1 cargo build --release --manifest-path apps/anycode-desktop/Cargo.toml

  dashboard-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/dashboard-ui/package-lock.json

      - name: Install dashboard-ui deps
        working-directory: crates/dashboard-ui
        run: npm ci

      - name: dashboard-ui test
        working-directory: crates/dashboard-ui
        run: npm test

      - name: dashboard-ui build
        working-directory: crates/dashboard-ui
        run: npm run build

      - name: Install Playwright browsers
        working-directory: crates/dashboard-ui
        run: npx playwright install --with-deps chromium

      - name: Build dashboard for e2e
        run: ANYCODE_BUILD_DASHBOARD_UI=1 cargo build --release -p anycode-dashboard --features embedded-ui

      - name: dashboard-ui e2e
        working-directory: crates/dashboard-ui
        run: npm run test:e2e

  account-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/account-service

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            crates/account-portal/package-lock.json
            crates/ops-portal/package-lock.json

      - name: account-service format
        working-directory: crates/account-service
        run: cargo fmt --all -- --check

      - name: account-service clippy
        working-directory: crates/account-service
        run: cargo clippy --all-targets -- -D warnings

      - name: account-service tests
        working-directory: crates/account-service
        run: cargo test --all-targets

      - name: account-portal build
        working-directory: crates/account-portal
        run: npm ci && npm run build

      - name: ops-portal build
        working-directory: crates/ops-portal
        run: npm ci && npm run build

  desktop-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/dashboard-ui/package-lock.json

      - name: macOS desktop release build (smoke)
        run: |
          set -euo pipefail
          export MACOSX_DEPLOYMENT_TARGET=10.15
          export CMAKE_OSX_DEPLOYMENT_TARGET=10.15
          export APPLE_SIGNING_IDENTITY="-"
          ./scripts/build-desktop-release.sh
        continue-on-error: true
