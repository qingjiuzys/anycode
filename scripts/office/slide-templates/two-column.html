<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Two Column · FDE Editorial</title>
  <style>
    :root{
      --bg:#f2f5f0; --ink:#231f20; --accent:#1400ff; --accent-soft:#7d8cff;
      --ink-60:rgba(35,31,32,.6); --ink-40:rgba(35,31,32,.4); --ink-08:rgba(35,31,32,.08);
      --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
      --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    }
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
    .slide{position:relative;padding:84px 110px;height:100%;box-sizing:border-box}
    .sec-label{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);display:flex;align-items:center;gap:16px;margin-bottom:30px}
    .sec-label::after{content:"";flex:1;height:6px;background:var(--ink);margin-left:8px}
    .sec-label .num{color:var(--accent);font-weight:700}
    h3{font-family:var(--serif);font-weight:900;font-size:46px;line-height:1.28;margin:0 0 44px;max-width:1400px}
    .duo{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--ink)}
    .col{padding:40px 44px}
    .col + .col{border-left:1px solid var(--ink)}
    .col.dark{background:var(--ink);color:var(--bg)}
    .col .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:14px}
    .col.dark .tag{color:var(--accent-soft)}
    .col h4{font-family:var(--serif);font-size:28px;font-weight:900;margin:0 0 16px}
    .col p{font-size:15px;line-height:1.7;color:var(--ink-60);margin:0 0 12px}
    .col.dark p{color:rgba(242,245,240,.65)}
    .col p b{color:var(--ink)}
    .col.dark p b{color:var(--bg)}
    .footer{position:absolute;bottom:40px;left:110px;right:110px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40)}
  </style>
</head>
<body>
  <div class="slide" data-type="two-column">
    <div class="sec-label"><span class="num">2.1</span>对比 · COMPARISON</div>
    <h3>对比页：左右各一个立场，结论留给观众</h3>
    <div class="duo">
      <div class="col">
        <div class="tag">方案 A · BEFORE</div>
        <h4>现状 / 传统路径</h4>
        <p>要点一：<b>关键事实</b>，说明文字。</p>
        <p>要点二：说明文字。</p>
        <p>要点三：说明文字。</p>
      </div>
      <div class="col dark">
        <div class="tag">方案 B · AFTER</div>
        <h4>目标 / 推荐路径</h4>
        <p>要点一：<b>关键事实</b>，说明文字。</p>
        <p>要点二：说明文字。</p>
        <p>要点三：说明文字。</p>
      </div>
    </div>
    <div class="footer"><span>品牌 · 演示文稿</span><span>第 07 页 / 共 24 页</span></div>
  </div>
</body>
</html>
