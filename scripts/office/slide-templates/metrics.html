<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Metrics · FDE Editorial</title>
  <style>
    :root{
      --bg:#f2f5f0; --ink:#231f20; --accent:#1400ff;
      --ink-60:rgba(35,31,32,.6); --ink-40:rgba(35,31,32,.4); --ink-08:rgba(35,31,32,.08);
      --serif:"Songti SC","STSong","Noto Serif SC","SimSun",serif;
      --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      --mono:"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    }
    body{margin:0;width:1920px;height:1080px;font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
    .slide{position:relative;padding:84px 110px;height:100%;box-sizing:border-box}
    .sec-label{font-family:var(--mono);font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-60);display:flex;align-items:center;gap:16px;margin-bottom:30px}
    .sec-label::after{content:"";flex:1;height:6px;background:var(--ink);margin-left:8px}
    .sec-label .num{color:var(--accent);font-weight:700}
    h3{font-family:var(--serif);font-weight:900;font-size:46px;line-height:1.28;margin:0 0 48px;max-width:1400px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ink-08);border:1px solid var(--ink-08)}
    .cell{background:var(--bg);padding:40px 34px 44px;min-height:230px}
    .cell .k{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:18px}
    .cell .n{font-family:var(--mono);font-weight:700;font-size:64px;letter-spacing:-.03em;line-height:1}
    .cell .n em{font-style:normal;font-size:24px;color:var(--ink-40)}
    .cell .d{font-size:14px;color:var(--ink-60);margin-top:14px;line-height:1.6}
    .cell.hero .n{color:var(--accent)}
    .note{margin-top:36px;font-family:var(--mono);font-size:12.5px;letter-spacing:.1em;color:var(--ink-60);text-transform:uppercase}
    .note b{color:var(--accent)}
    .footer{position:absolute;bottom:40px;left:110px;right:110px;display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40)}
  </style>
</head>
<body>
  <div class="slide" data-type="metrics">
    <div class="sec-label"><span class="num">3.1</span>指标 · METRICS</div>
    <h3>数字页：每个指标都回答一个业务问题</h3>
    <div class="grid">
      <div class="cell hero"><div class="k">核心指标 · KPI</div><div class="n">-42<em>%</em></div><div class="d">这个指标回答：值不值。口径与周期写在这里。</div></div>
      <div class="cell"><div class="k">效率 · THROUGHPUT</div><div class="n">3.1<em>×</em></div><div class="d">对比基线写清楚，否则数字没有意义。</div></div>
      <div class="cell"><div class="k">质量 · DEFECTS</div><div class="n">0.8<em>%</em></div><div class="d">一句话口径说明。</div></div>
      <div class="cell"><div class="k">成本 · COST</div><div class="n">¥38<em>万</em></div><div class="d">一句话口径说明。</div></div>
      <div class="cell"><div class="k">覆盖 · COVERAGE</div><div class="n">96<em>%</em></div><div class="d">一句话口径说明。</div></div>
      <div class="cell"><div class="k">满意度 · NPS</div><div class="n">62</div><div class="d">一句话口径说明。</div></div>
    </div>
    <p class="note">读法：<b>先看 hero 指标</b>，其余按行扫；所有口径与数据来源在附录。</p>
    <div class="footer"><span>品牌 · 演示文稿</span><span>第 12 页 / 共 24 页</span></div>
  </div>
</body>
</html>
