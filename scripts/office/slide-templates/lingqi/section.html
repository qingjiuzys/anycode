<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Section Divider</title>
  <style>
    body{margin:0;width:1920px;height:1080px;font-family:"PingFang SC","Arial",sans-serif;background:#F7FAFD;color:#1B3A5C;overflow:hidden}
    .slide{position:relative;padding:0;height:100%;box-sizing:border-box;display:flex}
    .left{width:42%;background:#1B3A5C;color:#fff;padding:100px 70px;display:flex;flex-direction:column;justify-content:center}
    .left h1{font-size:56px;line-height:1.15;margin:0 0 24px}
    .left p{font-size:22px;opacity:0.82;line-height:1.5}
    .right{flex:1;padding:80px 70px}
    .right h2{font-size:22px;text-transform:uppercase;letter-spacing:2px;color:#7B4F00;margin:0 0 28px}
    .agenda{list-style:none;padding:0;margin:0}
    .agenda li{font-size:26px;padding:22px 0;border-bottom:1px solid #E8F0FA;display:flex;align-items:center;gap:20px}
    .num{background:#00B050;color:#fff;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0}
    .accent-bar-bottom{position:absolute;bottom:0;left:0;width:1920px;height:6px;background:#00B050}
  </style>
</head>
<body>
  <div class="slide" data-type="section">
    <div class="left">
      <h1>第二部分<br/>方案与路径</h1>
      <p>从问题定义到可量化指标、实施计划与风险应对。</p>
    </div>
    <div class="right">
      <h2>Agenda</h2>
      <ol class="agenda">
        <li><span class="num">3</span>核心指标与 ROI 模型</li>
        <li><span class="num">4</span>产品架构与交付路径</li>
        <li><span class="num">5</span>风险、合规与里程碑</li>
        <li><span class="num">6</span>采购 Ask 与下一步</li>
      </ol>
    </div>
    <div class="accent-bar-bottom"></div>
  </div>
</body>
</html>
