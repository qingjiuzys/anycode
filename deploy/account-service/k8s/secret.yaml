# K8s Secret template — fill real values locally, do NOT commit secrets.
#
# Prefer kubectl (never commit filled values):
#   kubectl create secret generic anycode-account-secrets -n dis-cloud \
#     --from-literal=DATABASE_URL='...' \
#     --from-literal=WECHAT_PAY_API_V3_KEY='...' \
#     --from-literal=WECHAT_PAY_APP_ID='...' \
#     --from-literal=WECHAT_PAY_MCH_ID='...' \
#     --from-literal=WECHAT_PAY_SERIAL_NO='...' \
#     ...
#
# WeChat PEM files (separate secret, mounted at /app/wechat-certs):
#   ./scripts/create-k8s-wechat-secret.sh dis-cloud
#
# Code reads IDENTITY_ENCRYPTION_SECRET / AUDIT_ENCRYPTION_SECRET (not *_KEY).
apiVersion: v1
kind: Secret
metadata:
  name: anycode-account-secrets
type: Opaque
stringData:
  DATABASE_URL: "mysql://USER:PASS@HOST:3306/anycode"
  WECHAT_PAY_API_V3_KEY: "REPLACE_ME"
  WECHAT_PAY_APP_ID: "REPLACE_ME"
  WECHAT_PAY_MCH_ID: "REPLACE_ME"
  WECHAT_PAY_SERIAL_NO: "REPLACE_ME"
  SMTP_HOST: "smtp.exmail.qq.com"
  SMTP_PORT: "465"
  SMTP_USERNAME: "admin@example.com"
  SMTP_PASSWORD: "REPLACE_ME"
  IDENTITY_ENCRYPTION_SECRET: "REPLACE_ME"
  AUDIT_ENCRYPTION_SECRET: "REPLACE_ME"
