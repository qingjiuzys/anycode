[workspace]

[package]
name = "anycode-desktop"
version = "0.3.0"
description = "anyCode desktop shell (Tauri + Digital Workbench)"
edition = "2021"

[[bin]]
name = "anycode-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anycode-apple-media = { path = "../../crates/apple-media" }
# Desktop uses the native macOS speech stack for TTS. Keep local embeddings/STT,
# but do not pull piper/espeak into the app bundle.
anycode-dashboard = { path = "../../crates/dashboard", features = ["embedded-ui", "tools-browser", "knowledge-embeddings", "embedding-local", "stt-local"] }
anycode-setup = { path = "../../crates/setup" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

# Local iterative builds: no LTO, parallel codegen (~1–2min vs ~5min release).
# Use: ./scripts/sync-desktop-dev.sh --rust   or   ANYCODE_DESKTOP_LOCAL_RELEASE=1
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
strip = false
