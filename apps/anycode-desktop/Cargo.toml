[workspace]

[package]
name = "anycode-desktop"
version = "0.2.3"
description = "anyCode desktop shell (Tauri + Digital Workbench)"
edition = "2021"

[[bin]]
name = "anycode-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anycode-apple-media = { path = "../../crates/apple-media" }
anycode-channel-bridge = { path = "../../crates/channel-bridge" }
anycode-dashboard = { path = "../../crates/dashboard", features = ["embedded-ui", "tools-browser", "knowledge-embeddings", "media-local"] }
anycode-setup = { path = "../../crates/setup" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "sync"] }
tracing = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

# Local iterative DMG builds: same bundle contents, faster link (no LTO).
# Use: ANYCODE_DESKTOP_LOCAL_RELEASE=1 ./scripts/build-desktop-release.sh
[profile.release-local]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 3
