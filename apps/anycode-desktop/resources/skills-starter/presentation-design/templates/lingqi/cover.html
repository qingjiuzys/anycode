<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Cover Slide</title>
  <style>
    body{margin:0;width:1920px;height:1080px;font-family:"PingFang SC","Arial",sans-serif;background:#1B3A5C;color:#fff;overflow:hidden}
    .slide{position:relative;padding:90px 100px 80px;height:100%;box-sizing:border-box}
    .accent-bar{position:absolute;top:0;left:0;width:14px;height:1080px;background:#00B050}
    .accent-bar-bottom{position:absolute;bottom:0;left:0;width:1920px;height:6px;background:linear-gradient(90deg,#00B050 30%,#2D5F8A 100%)}
    .brand-tag{position:absolute;top:48px;right:80px;font-size:14px;letter-spacing:2px;opacity:0.5;text-transform:uppercase;color:#EEF3F8}
    h1{font-size:60px;font-weight:700;margin:120px 0 18px;line-height:1.12;max-width:1200px}
    .subtitle{font-size:28px;opacity:0.88;margin-bottom:28px;font-weight:300;line-height:1.45;max-width:1100px;color:#EEF3F8}
    .meta{font-size:17px;opacity:0.55;border-top:1px solid rgba(255,255,255,0.15);padding-top:20px;display:inline-block;margin-bottom:36px}
    .value-row{display:flex;gap:18px;margin-top:8px}
    .chip{flex:1;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:18px 20px}
    .chip .n{font-size:34px;font-weight:800;color:#00B050;display:block;margin-bottom:6px}
    .chip .t{font-size:15px;line-height:1.4;opacity:0.85}
    .footer{position:absolute;bottom:28px;left:100px;right:100px;display:flex;justify-content:space-between;font-size:13px;opacity:0.35;color:#EEF3F8}
  </style>
</head>
<body>
  <div class="slide" data-type="cover">
    <div class="accent-bar"></div>
    <div class="accent-bar-bottom"></div>
    <div class="brand-tag">Enterprise Briefing</div>
    <h1>产品标题 · 完整价值主张</h1>
    <p class="subtitle">副标题：一句话说明受众、场景、差异化。必须包含一个可量化结果（如 -70% 工具切换）。</p>
    <p class="meta">Executive Briefing · 2026-07-23 · Confidential · Owner: 姓名</p>
    <div class="value-row">
      <div class="chip"><span class="n">42%</span><span class="t">效率/周期类核心指标</span></div>
      <div class="chip"><span class="n">3.1×</span><span class="t">速度/倍数类指标</span></div>
      <div class="chip"><span class="n">$380K</span><span class="t">成本/ROI 类指标</span></div>
    </div>
    <div class="footer"><span>品牌名 · anycode.ai</span><span>SOC 2 Ready · Enterprise</span></div>
  </div>
</body>
</html>
